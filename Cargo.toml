[package]
name = "gangli"
version = "0.0.0" # the real version is 0.0.<build number>, from GANGLI_BUILD at build time
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
data-encoding = "2.11.1"
iroh = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.164"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
