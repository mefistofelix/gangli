[package]
name = "gangli"
version = "0.0.0" # the real version is 0.0.<build number>, from GANGLI_BUILD at build time
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
clap = { version = "4.5.21", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.164"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
