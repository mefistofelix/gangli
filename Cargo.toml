[package]
name = "gangli"
version = "0.0.0" # the real version is 0.0.<build number>, from GANGLI_BUILD at build time
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
anyhow = "1.0.104"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.9", features = ["derive"] }
data-encoding = "2.11.1"
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
# unstable-net-report: the public address, NAT behaviour and UDP reachability, for the network diagnostics
iroh = { version = "1.5.0", features = ["unstable-net-report"] }
pkarr = "9.0.0"
qrcodegen = "1.8.0"
# SHA-256 and AES-256-GCM for pairing from the phone (the same primitives as the browser's WebCrypto); already
# built for russh
ring = "0.17.14"
# HTTPS client for the console's GeoIP lookups; already in the tree through iroh and pkarr (their TLS)
reqwest = { version = "0.13.5", default-features = false }
# reqwest's TLS takes the process-wide crypto provider: ring, installed before the first request
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
russh ={ version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "signal"] }
toml = "1.2.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process", "pty", "termios"] }

# GUI: eframe (winit) and tray-icon on Windows and macOS
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# `clipboard`: without it copy (codes, passwords, tokens, instructions) and paste (the terminal) do nothing
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "clipboard"] }
tray-icon = { version = "0.26.1", default-features = false }

# Windows draws on the CPU: Direct3D 12 through wgpu on WARP, Windows' software renderer (any machine): old
# cards' OpenGL drivers draw egui wrong, virtual machines have no OpenGL at all
[target.'cfg(windows)'.dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["wgpu_no_default_features"]

[target.'cfg(windows)'.dependencies.wgpu]
version = "30.0.0"
default-features = false
features = ["std", "dx12", "wgsl"]

[target.'cfg(target_os = "macos")'.dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["glow"]

# GUI on Linux without any system library: X11 protocol in pure Rust, egui drawn on the CPU, tray over D-Bus
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", default-features = false }
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
# logind's sleep inhibitor (keep awake); already in the tree through ksni
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
