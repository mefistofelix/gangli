[package]
name = "gangli"
version = "0.0.0" # the real version is 0.0.<build number>, from GANGLI_BUILD at build time
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
anyhow = "1.0.104"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.9", features = ["derive"] }
data-encoding = "2.11.1"
iroh = "1.5.0"
pkarr = "9.0.0"
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "signal"] }
toml = "1.2.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process", "pty", "termios"] }
